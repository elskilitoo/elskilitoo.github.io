<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>elskilitoo</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes: Inter y JetBrains Mono para el estilo tech limpio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /* Variables principales de tema Cian */
        :root {
            --bg-main: #0b0d10;
            --card-bg: #12151a;
            --card-border: #1e242d;
            --accent-cyan: #00e5ff;
            --accent-cyan-soft: rgba(0, 229, 255, 0.25);
            --accent-cyan-glow: rgba(0, 229, 255, 0.14);
        }

        body {
            background-color: var(--bg-main);
            /* Sutil resplandor radial cian en la parte superior igual que la referencia */
            background-image: radial-gradient(circle at 50% 0%, var(--accent-cyan-glow) 0%, transparent 55%);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem 4rem;
        }

        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Tarjeta oscura centrada con borde sutil */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 229, 255, 0.04);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            border-color: rgba(0, 229, 255, 0.3);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 45px rgba(0, 229, 255, 0.07);
        }

        /* Barra de búsqueda estilo captura */
        .search-box {
            background-color: #161a21;
            border: 1px solid #222833;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box:focus-within {
            border-color: rgba(0, 229, 255, 0.6);
            box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.12);
        }

        /* Tarjeta individual de proyecto estilo captura */
        .project-item {
            background-color: #151920;
            border: 1px solid #212732;
            transition: all 0.22s ease;
        }

        .project-item:hover {
            background-color: #181e27;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.12);
            transform: translateY(-1px);
        }

        .project-item:hover .project-arrow {
            color: var(--accent-cyan);
            transform: translate(2px, -2px);
        }

        .font-mono-tech {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Tarjeta oscura centrada con borde sutil */
        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 40px rgba(0, 229, 255, 0.04);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .profile-card:hover {
            border-color: rgba(0, 229, 255, 0.35);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 45px rgba(0, 229, 255, 0.08);
        }

        /* Avatar circular con borde cian y brillo exterior */
        .avatar-ring {
            width: 116px;
            height: 116px;
            border-radius: 9999px;
            border: 2.5px solid var(--accent-cyan);
            box-shadow: 0 0 22px var(--accent-cyan-soft), inset 0 0 12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            position: relative;
            background-color: #181c24;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .avatar-ring:hover {
            transform: scale(1.03);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.45);
        }

        .pixel-avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Notificación discreta al copiar o cambiar foto -->
    <div id="status-toast" class="fixed bottom-5 right-5 z-50 px-4 py-2.5 rounded-xl bg-[#12151a] border border-[#00e5ff]/50 text-xs font-mono-tech text-[#00e5ff] shadow-lg opacity-0 translate-y-3 pointer-events-none transition-all duration-300">
        Copiado al portapapeles
    </div>

    <!-- Contenedor Principal Alineado Arriba -->
    <main class="w-full max-w-3xl mx-auto">
        <section class="profile-card rounded-2xl px-5 py-9 sm:px-10 sm:py-11 relative overflow-hidden">
            
            <!-- Sutil línea de brillo cian en el borde superior de la tarjeta -->
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-2/3 h-[1px] bg-gradient-to-r from-transparent via-[#00e5ff]/60 to-transparent"></div>

            <!-- Cabecera Superior: Foto de Perfil + Nombre Grande (sin subtítulos debajo) -->
            <header class="flex flex-col items-center text-center">
                <div class="avatar-ring mb-5 cursor-pointer group" onclick="document.getElementById('custom-avatar-input').click()" title="Tu perfil (haz clic si deseas probar otra imagen)">
                    <img 
                        id="avatar-img" 
                        alt="Foto de perfil de elskilitoo" 
                        class="pixel-avatar"
                    >
                    <input type="file" id="custom-avatar-input" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </div>

                <h1 
                    onclick="copyUsername()" 
                    title="Haz clic para copiar el nombre"
                    class="font-mono-tech text-3xl sm:text-4xl font-bold text-white tracking-tight cursor-pointer hover:text-[#00e5ff] transition-colors select-all"
                >
                    elskilitoo
                </h1>
            </header>

            <!-- Separador Horizontal Sutil -->
            <hr class="border-t border-[#1f242d] my-8">

            <!-- Barra de Búsqueda Funcional -->
            <div class="mb-7">
                <label for="project-search" class="sr-only">Filtrar proyectos o enlaces</label>
                <div class="search-box flex items-center gap-3 px-4 py-3 rounded-xl">
                    <span class="text-base select-none" aria-hidden="true">🔍</span>
                    <input 
                        type="text" 
                        id="project-search" 
                        oninput="filterProjects()"
                        placeholder="Filtrar proyectos o enlaces..." 
                        autocomplete="off"
                        class="w-full bg-transparent text-sm text-slate-200 placeholder-slate-500 focus:outline-none font-mono-tech"
                    >
                    <button 
                        id="clear-search-btn" 
                        type="button"
                        onclick="clearSearch()" 
                        class="hidden text-xs font-mono-tech text-slate-400 hover:text-[#00e5ff] px-1.5 py-0.5 rounded transition-colors"
                        title="Limpiar búsqueda"
                    >
                        ✕
                    </button>
                </div>
            </div>

            <!-- Encabezado de Sección: MIS PROYECTOS + Badge -->
            <div class="flex items-center gap-2.5 mb-4">
                <span class="text-base select-none" aria-hidden="true">🚀</span>
                <h2 class="font-mono-tech text-xs sm:text-sm font-bold uppercase tracking-widest text-slate-300">
                    MIS PROYECTOS
                </h2>
                <span id="projects-count" class="inline-flex items-center justify-center px-2.5 py-0.5 rounded-full text-xs font-mono-tech font-bold bg-[#1c222c] text-slate-300 border border-[#2a3240]">
                    1
                </span>
            </div>

            <!-- Lista de Proyectos -->
            <div id="projects-list" class="flex flex-col gap-3">
                <a 
                    href="https://elskilitoo.github.io/termit" 
                    target="_blank" 
                    rel="noopener noreferrer"
                    data-title="termit convierte tu pc en un servidor de minecraft."
                    class="project-item group flex items-center justify-between gap-4 px-4 py-3.5 sm:px-5 sm:py-4 rounded-xl text-left"
                >
                    <div class="flex items-center gap-3 min-w-0">
                        <span class="font-mono-tech text-sm font-bold text-[#00e5ff] shrink-0">&gt;</span>
                        <span class="font-mono-tech text-sm sm:text-[15px] font-medium text-slate-100 group-hover:text-white truncate sm:whitespace-normal">
                            Termit convierte tu pc en un servidor de minecraft.
                        </span>
                    </div>

                    <div class="flex items-center shrink-0">
                        <span class="project-arrow font-mono-tech text-sm text-slate-500 transition-transform duration-200" aria-hidden="true">
                            ↗
                        </span>
                    </div>
                </a>
            </div>

            <!-- Mensaje discreto cuando el filtro no encuentra coincidencias -->
            <div id="empty-search-state" class="hidden py-8 text-center">
                <p class="font-mono-tech text-xs sm:text-sm text-slate-500">
                    No se encontraron proyectos que coincidan con tu búsqueda.
                </p>
            </div>

        </section>
    </main>

    <script>
        /**
         * Genera el PNG exacto 256x256 (escalado desde la matriz 8x8 sin suavizado)
         * de la foto de perfil de elskilitoo y lo asigna directamente al elemento <img>.
         */
        function renderProfileAvatar() {
            const pixelGrid = [
                ['#b5b5b5', '#f5e600', '#a8a8a8', '#f5e600', '#f5e600', '#a8a8a8', '#f5e600', '#b5b5b5'],
                ['#e6dc00', '#c91400', '#c2b500', '#24b314', '#2832c2', '#e6dc00', '#2db3e6', '#c2b500'],
                ['#c2b500', '#c2b500', '#c2b500', '#c2b500', '#c2b500', '#c2b500', '#c2b500', '#c2b500'],
                ['#cccccc', '#cccccc', '#cccccc', '#cccccc', '#cccccc', '#cccccc', '#cccccc', '#cccccc'],
                ['#c2c2c2', '#454545', '#454545', '#c7c7c7', '#bdbdbd', '#454545', '#454545', '#c2c2c2'],
                ['#a8a8a8', '#a8a8a8', '#b5b5b5', '#787878', '#787878', '#a8a8a8', '#a8a8a8', '#a8a8a8'],
                ['#828282', '#454545', '#454545', '#454545', '#454545', '#454545', '#454545', '#828282'],
                ['#b8b8b8', '#b8b8b8', '#cccccc', '#cccccc', '#cccccc', '#cccccc', '#b8b8b8', '#b8b8b8']
            ];

            // Canvas base 8x8
            const baseCanvas = document.createElement('canvas');
            baseCanvas.width = 8;
            baseCanvas.height = 8;
            const baseCtx = baseCanvas.getContext('2d');

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    baseCtx.fillStyle = pixelGrid[row][col];
                    baseCtx.fillRect(col, row, 1, 1);
                }
            }

            // Canvas escalado 256x256 con bordes nítidos (sin difuminado)
            const hdCanvas = document.createElement('canvas');
            hdCanvas.width = 256;
            hdCanvas.height = 256;
            const hdCtx = hdCanvas.getContext('2d');
            hdCtx.imageSmoothingEnabled = false;
            hdCtx.drawImage(baseCanvas, 0, 0, 256, 256);

            const avatarImg = document.getElementById('avatar-img');
            avatarImg.src = hdCanvas.toDataURL('image/png');
        }

        // Ejecutar al cargar la página
        renderProfileAvatar();

        // Filtrado en tiempo real de proyectos
        function filterProjects() {
            const input = document.getElementById('project-search');
            const query = input.value.trim().toLowerCase();
            const clearBtn = document.getElementById('clear-search-btn');
            const items = document.querySelectorAll('#projects-list .project-item');
            const emptyState = document.getElementById('empty-search-state');
            const countBadge = document.getElementById('projects-count');

            if (query.length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }

            let visibleCount = 0;
            items.forEach(item => {
                const title = item.getAttribute('data-title') || item.textContent.toLowerCase();
                if (title.includes(query)) {
                    item.classList.remove('hidden');
                    visibleCount++;
                } else {
                    item.classList.add('hidden');
                }
            });

            countBadge.textContent = visibleCount;

            if (visibleCount === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        // Limpiar el campo de búsqueda
        function clearSearch() {
            const input = document.getElementById('project-search');
            input.value = '';
            filterProjects();
            input.focus();
        }

        // Permite cambiar la imagen temporalmente si se selecciona un archivo
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatar-img').src = e.target.result;
                showToast('Foto de perfil actualizada');
            };
            reader.readAsDataURL(file);
        }

        // Copiar el nombre al hacer clic sobre 'elskilitoo'
        function copyUsername() {
            const temp = document.createElement('textarea');
            temp.value = 'elskilitoo';
            temp.style.position = 'fixed';
            temp.style.opacity = '0';
            document.body.appendChild(temp);
            temp.select();
            try {
                document.execCommand('copy');
                showToast('Nombre "elskilitoo" copiado');
            } catch (e) {}
            document.body.removeChild(temp);
        }

        let toastTimer;
        function showToast(text) {
            const toast = document.getElementById('status-toast');
            toast.textContent = text;
            toast.classList.remove('opacity-0', 'translate-y-3');
            toast.classList.add('opacity-100', 'translate-y-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-3');
            }, 2200);
        }
    </script>
</body>
</html>
